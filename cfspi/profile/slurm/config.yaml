# SLURM specific stuff
executor: slurm
default-resources:
  threads: 1
  slurm_account: compgen
  slurm_partition: cpu
slurm-requeue: False
slurm-status-command: sacct

# Conda stuff
use-conda: True
conda-frontend: conda
conda-prefix: /hpc/compgen/projects/cf-spi/cf-spi/analysis/pvanrijn/snakemake/conda-cache
# conda-prefix: /path/to/conda/prefix

# Singularity/Apptainer stuff
# use-singularity: True

# General stuff
jobs: 100
latency-wait: 240
# restart-times: 3
keep-going: True
rerun-incomplete: True
printshellcmds: True
show-failed-logs: True

